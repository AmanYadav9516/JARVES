name: Build JARVES Android APK & Deploy Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug

    - name: Copy Compiled APK to Root & Website
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk website/JARVES-AI-v1.0.0.apk
        cp app/build/outputs/apk/debug/app-debug.apk JARVES-AI-v1.0.0.apk

    - name: Upload JARVES APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JARVES-AI-Assistant.apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create Automatic Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: "JARVES AI v1.0.0 Official Android Release"
        body: "Official 22MB+ working installable APK build for JARVES AI Assistant."
        files: app/build/outputs/apk/debug/app-debug.apk
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
